server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Enable compression for fast portal loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json;

    # Large client body and buffer settings for large test files
    client_max_body_size 100M;

    # PDF Notes Caching & Headers
    location /NOTES/ {
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options nosniff;
        types {
            application/pdf pdf;
        }
    }

    # Static fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
